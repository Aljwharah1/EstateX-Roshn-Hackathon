<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateX Advisor</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --teal:       #4ecdc4;
      --teal-deep:  #1a9e96;
      --teal-dark:  #0d3331;
      --bg:         #0b0e0e;
      --surface:    #141919;
      --surface-2:  #1c2424;
      --surface-3:  #243030;
      --border:     rgba(78,205,196,0.12);
      --border-2:   rgba(78,205,196,0.22);
      --text:       #e8f0ef;
      --text-muted: #7a9b98;
      --text-dim:   #4a6b68;
      --radius-lg:  18px;
      --radius-md:  12px;
      --radius-sm:  8px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── SHELL ── */
    .shell {
      width: 100%;
      max-width: 860px;
      height: 92vh;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(78,205,196,0.05),
        0 32px 80px rgba(0,0,0,0.6),
        0 0 120px rgba(78,205,196,0.04) inset;
      position: relative;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--teal), var(--teal-deep));
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: var(--teal-dark);
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(78,205,196,0.25);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .brand-tag {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 11px;
      background: rgba(78,205,196,0.08);
      border: 1px solid rgba(78,205,196,0.2);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
    }

    .status-dot {
      width: 7px; height: 7px;
      background: var(--teal);
      border-radius: 50%;
      animation: pulse 2.5s ease infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }

    .icon-btn {
      height: 38px;
      padding: 0 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    .icon-btn:hover {
      background: var(--surface-3);
      border-color: var(--border-2);
      color: var(--teal);
    }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

    /* date divider */
    .date-chip {
      align-self: center;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      padding: 5px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      margin: 10px 0 6px;
      letter-spacing: 0.4px;
    }

    /* row */
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: msgIn 0.22s ease;
    }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot  { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0; margin-top: 2px;
    }

    .msg-row.user .avatar {
      background: linear-gradient(135deg, var(--teal), var(--teal-deep));
      color: var(--teal-dark);
    }

    .msg-row.bot .avatar {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--teal);
    }

    .bubble-wrap { display: flex; flex-direction: column; gap: 4px; }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .msg-row.user .bubble {
      background: linear-gradient(135deg, var(--teal), var(--teal-deep));
      color: var(--teal-dark);
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }

    .msg-row.bot .bubble {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 10.5px;
      color: var(--text-dim);
      padding: 0 3px;
    }

    .msg-row.user .msg-time { text-align: right; }

    /* quick action chip under bot message */
    .quick-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--border-2);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background 0.18s, border-color 0.18s;
    }

    .quick-action:hover {
      background: rgba(78,205,196,0.08);
      border-color: var(--teal);
    }

    /* typing */
    .typing-row {
      display: none;
      align-self: flex-start;
    }

    .typing-row.active { display: flex; gap: 10px; }

    .typing-dots {
      display: flex; gap: 4px;
      padding: 12px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      border-bottom-left-radius: 4px;
    }

    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--teal);
      border-radius: 50%;
      animation: tdot 1.3s ease infinite;
      opacity: 0.5;
    }
    .typing-dots span:nth-child(1){animation-delay:0s}
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}
    @keyframes tdot { 0%,60%,100%{transform:translateY(0);opacity:0.5} 30%{transform:translateY(-6px);opacity:1} }

    /* ── INPUT BAR ── */
    .input-area {
      padding: 16px 20px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px 8px 8px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(78,205,196,0.5);
      box-shadow: 0 0 0 3px rgba(78,205,196,0.08);
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      padding: 8px 0;
    }

    #msgInput::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--teal), var(--teal-deep));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
      color: var(--teal-dark);
      font-size: 16px;
    }

    .send-btn:hover { transform: scale(1.06); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* send icon svg */
    .send-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--teal-dark); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── PREFERENCES PANEL ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .pref-panel {
      width: 100%;
      max-height: 88%;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      transform: translateY(30px);
      transition: transform 0.28s cubic-bezier(0.34,1.2,0.64,1);
      overflow: hidden;
    }

    .overlay.open .pref-panel {
      transform: translateY(0);
    }

    .pref-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pref-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .pref-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .close-btn {
      width: 32px; height: 32px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
      transition: background 0.18s, color 0.18s;
      flex-shrink: 0;
    }

    .close-btn:hover { background: var(--surface-3); color: var(--text); }

    .pref-body {
      overflow-y: auto;
      padding: 20px 24px;
      flex: 1;
    }

    .pref-body::-webkit-scrollbar { width: 4px; }
    .pref-body::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

    /* section label */
    .pref-section {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 18px 0 10px;
    }

    .pref-section:first-child { margin-top: 0; }

    .pref-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pref-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .pref-grid.single { grid-template-columns: 1fr; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field input,
    .field select,
    .field textarea {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: border-color 0.18s, box-shadow 0.18s;
      -webkit-appearance: none;
    }

    .field textarea { min-height: 60px; resize: vertical; }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(78,205,196,0.5);
      box-shadow: 0 0 0 3px rgba(78,205,196,0.07);
    }

    .field select option { background: var(--surface-2); }

    /* toggle chips for short options */
    .chip-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .chip.active {
      background: rgba(78,205,196,0.12);
      border-color: rgba(78,205,196,0.45);
      color: var(--teal);
    }

    .pref-footer {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.18s;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal), var(--teal-deep));
      border: none;
      color: var(--teal-dark);
      box-shadow: 0 4px 14px rgba(78,205,196,0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(78,205,196,0.32); }

    /* toast */
    .toast {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--surface-3);
      border: 1px solid var(--border-2);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      body { padding: 0; }
      .shell { height: 100dvh; border-radius: 0; border: none; }
      .pref-grid { grid-template-columns: 1fr; }
      .pref-grid.cols-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
<div class="shell">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <div class="brand-name">EstateX Advisor</div>
        <div class="brand-tag">AI Real Estate Assistant</div>
      </div>
    </div>

    <div class="header-right">
      <div class="status-badge">
        <div class="status-dot"></div>
        Online
      </div>
      <button class="icon-btn" onclick="openPrefs()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Preferences
      </button>
    </div>
  </header>

  <!-- MESSAGES -->
  <div class="messages" id="messages">

    <div class="date-chip">Today</div>

    <!-- typing -->
    <div class="typing-row" id="typingRow">
      <div class="avatar" style="background:var(--surface-3);border:1px solid var(--border);color:var(--teal);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px;">✦</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-row" id="inputRow">
      <input id="msgInput" type="text" placeholder="Ask about properties…" autocomplete="off"
        onkeydown="if(event.key==='Enter')sendMsg()"/>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- PREFERENCES PANEL -->
  <div class="overlay" id="prefsOverlay" onclick="if(event.target===this)closePrefs()">
    <div class="pref-panel">
      <div class="pref-header">
        <div>
          <div class="pref-title">Preferences</div>
          <div class="pref-subtitle">All settings used to personalise your recommendations</div>
        </div>
        <button class="close-btn" onclick="closePrefs()">✕</button>
      </div>

      <div class="pref-body">

        <!-- PROFILE -->
        <div class="pref-section">Profile</div>
        <div class="pref-grid">
          <div class="field">
            <label>Role</label>
            <div class="chip-group" id="roleChips">
              <div class="chip active" onclick="selectChip('roleChips',this)">Buyer</div>
              <div class="chip" onclick="selectChip('roleChips',this)">Renter</div>
              <div class="chip" onclick="selectChip('roleChips',this)">Investor</div>
              <div class="chip" onclick="selectChip('roleChips',this)">Agent</div>
            </div>
          </div>
          <div class="field">
            <label>Language</label>
            <div class="chip-group" id="langChips">
              <div class="chip active" onclick="selectChip('langChips',this)">عربي</div>
              <div class="chip" onclick="selectChip('langChips',this)">English</div>
            </div>
          </div>
          <div class="field">
            <label>Life stage</label>
            <select id="pLifeStage">
              <option value="0">Family</option>
              <option value="1">Young family</option>
              <option value="2">Single professional</option>
              <option value="3">Married, no children</option>
              <option value="4">Large family</option>
            </select>
          </div>
          <div class="field">
            <label>Household size</label>
            <input id="pHousehold" type="number" value="3" min="1"/>
          </div>
        </div>

        <!-- LOCATION -->
        <div class="pref-section">Location</div>
        <div class="pref-grid">
          <div class="field">
            <label>City</label>
            <input id="pCity" value="الرياض"/>
          </div>
          <div class="field">
            <label>Included districts</label>
            <input id="pDistIncl" value="نمار, الجنادرية" placeholder="Comma separated"/>
          </div>
          <div class="field">
            <label>Excluded districts</label>
            <input id="pDistExcl" placeholder="Optional"/>
          </div>
          <div class="field">
            <label>Max commute (minutes)</label>
            <input id="pCommuteMax" type="number" value="35" min="0"/>
          </div>
        </div>

        <!-- PROPERTY -->
        <div class="pref-section">Property</div>
        <div class="pref-grid cols-3">
          <div class="field">
            <label>Property type</label>
            <input id="pPropType" value="شقة"/>
          </div>
          <div class="field">
            <label>Bedrooms</label>
            <input id="pBeds" type="number" value="2" min="0"/>
          </div>
          <div class="field">
            <label>Bathrooms</label>
            <input id="pBaths" type="number" value="2" min="0"/>
          </div>
          <div class="field">
            <label>Area min (m²)</label>
            <input id="pAreaMin" type="number" value="80" min="0"/>
          </div>
          <div class="field">
            <label>Area max (m²)</label>
            <input id="pAreaMax" type="number" value="180" min="0"/>
          </div>
        </div>

        <!-- FINANCIAL -->
        <div class="pref-section">Financial</div>
        <div class="pref-grid">
          <div class="field">
            <label>Monthly ceiling (SAR)</label>
            <input id="pMonthly" type="number" value="7000" min="0"/>
          </div>
          <div class="field">
            <label>Down payment budget (SAR)</label>
            <input id="pDown" type="number" value="150000" min="0"/>
          </div>
          <div class="field">
            <label>Financing type</label>
            <div class="chip-group" id="finChips">
              <div class="chip active" onclick="selectChip('finChips',this)">Mortgage</div>
              <div class="chip" onclick="selectChip('finChips',this)">Cash</div>

        .from('users')

        .eq('user_id', userId)
        .maybeSingle();
      if (selErr) {
        console.warn('Could not check existing user:', selErr.message);
        return null;
      }
      if (existing) return existing;

      const { data: inserted, error: insErr } = await sb
        .from('users')
        .insert([{
          user_id: userId,
          role: 'buyer',
          preferred_language: 'ar',

          risk_tolerance: 'medium',
          created_at: new Date().toISOString(),
          last_active_at: new Date().toISOString()

        .select('*')
        .single();
      
      // Handle RLS policy violations gracefully - user may have been created already
      if (insErr) {
        const errMsg = insErr.message || JSON.stringify(insErr);
        if (errMsg.includes('row-level security') || errMsg.includes('RLS')) {
          console.warn('RLS policy prevented user insert - user may exist already:', errMsg);
          return null; // Continue without blocking the app
        }
        throw insErr;
      }
      return inserted;
    } catch (err) {
      console.warn('Error in ensureUsersRow:', err.message || err);

  function formatPropertiesMessage(properties) {
    if (!properties || properties.length === 0) {
      return 'No properties found matching your preferences yet. Let me help you find the perfect property! Would you like to update your preferences to see more options?';
    }

    let message = `🎯 Great! I found ${properties.length} perfect match${properties.length !== 1 ? 'es' : ''} for you based on your preferences:\n\n`;
    properties.forEach((prop, idx) => {
      const trans = prop.transactions?.[0];
      const price = trans?.price_sar ? `${trans.price_sar} SAR` : 'Price not listed';
      const area = trans?.area_sqm ? `${trans.area_sqm} m²` : 'Area unknown';
      const pricePerSqm = prop.avg_price_per_sqm ? `${prop.avg_price_per_sqm.toFixed(0)} SAR/m²` : 'N/A';
      const rank = idx + 1 === 1 ? '⭐ Top Pick' : idx + 1 === 2 ? '🥈 #2' : `#${idx + 1}`;
      
      message += `${rank} ${prop.property_type || 'Property'} - ${prop.district || 'Location'}\n`;
      message += `   📍 ${prop.location || 'Location unknown'}\n`;
      message += `   💰 ${price} (${pricePerSqm})\n`;
      message += `   📐 ${area}\n`;
      
      if (trans?.date) {
        const date = new Date(trans.date).toLocaleDateString();
        message += `   📅 Latest transaction: ${date}\n`;
      }
      message += '\n';
    });

    message += 'Would you like more details about any of these properties? Or I can help you refine your search with better preferences!';
    return message;
  }

  async function upsertPreferences(userId, payload) {

        .from('user_preferences')

        .order('updated_at', { ascending: false })
        .limit(1);

      if (checkErr) {
        console.error('Error checking existing preferences:', checkErr);
        throw checkErr;
      }

      console.log('Existing preferences:', existing);

      if (existing?.length) {
        console.log('Updating preference with ID:', existing[0].preference_id);
        const { data, error } = await sb
          .from('user_preferences')
          .update({ ...payload, updated_at: new Date().toISOString() })
          .eq('preference_id', existing[0].preference_id)
          .select('*');
        
        if (error) {
          console.error('Update error:', error);
          throw error;
        }
        console.log('Updated preference data:', data);
        return data?.[0] || null;
      } else {
        console.log('No existing preferences, inserting new');
        const { data, error } = await sb
          .from('user_preferences')
          .insert([{ user_id: userId, ...payload, updated_at: new Date().toISOString() }])
          .select('*');
        
        if (error) {
          console.error('Insert error:', error);
          throw error;
        }
        console.log('Inserted preference data:', data);
        return data?.[0] || null;
      }
    } catch (err) {
      console.error('upsertPreferences error:', err);
      throw err;
    }
  }

  // Map DB values → chip label (and back)
  const ROLE_MAP     = { buyer: 'Buyer', renter: 'Renter', investor: 'Investor', agent: 'Agent' };
  const ROLE_RMAP    = Object.fromEntries(Object.entries(ROLE_MAP).map(([k,v]) => [v,k]));
  const LANG_MAP     = { ar: 'عربي', en: 'English' };

  const FIN_MAP      = { mortgage: 'Mortgage', cash: 'Cash' };

  const RISK_MAP     = { low: 'Low', medium: 'Medium', high: 'High' };

  const STAGE_VALUES = ['family','young_family','single_professional','married_no_children','large_family'];
  const STAGE_LABELS = ['Family','Young family','Single professional','Married, no children','Large family'];

  function setActiveChip(groupId, label) {
    document.querySelectorAll('#' + groupId + ' .chip').forEach(c => {
      c.classList.toggle('active', c.textContent.trim() === label);
    });

  function populatePrefsForm() {
    // Profile
    setActiveChip('roleChips', ROLE_MAP[currentUserRow?.role] || 'Buyer');
    setActiveChip('langChips', LANG_MAP[currentUserRow?.preferred_language] || 'عربي');
    const lifeStageIdx = STAGE_VALUES.indexOf(currentUserRow?.life_stage || 'family');

    // Location

    document.getElementById('pDistExcl').value      = (currentPrefs?.districts_excluded || []).join(', ');

    // Property
    document.getElementById('pPropType').value = currentPrefs?.property_type || '';
    document.getElementById('pBeds').value     = currentPrefs?.bedrooms ?? 2;
    document.getElementById('pBaths').value    = currentPrefs?.bathrooms ?? 2;
    document.getElementById('pAreaMin').value  = currentPrefs?.area_min ?? 80;
    document.getElementById('pAreaMax').value  = currentPrefs?.area_max ?? 180;

    // Financial
    document.getElementById('pMonthly').value  = currentFin?.monthly_payment_ceiling ?? 7000;
    document.getElementById('pDown').value     = currentFin?.down_payment_budget ?? 150000;
    document.getElementById('pHorizon').value  = currentFin?.investment_horizon_months ?? 24;
    setActiveChip('finChips',   FIN_MAP[currentFin?.financing] || 'Mortgage');
    setActiveChip('riskChips',  RISK_MAP[currentUserRow?.risk_tolerance] || 'Medium');
    const preap = currentFin?.preapproval_status === true ? 'Yes' : 'No';
    setActiveChip('preapChips', preap);

    // Hide pre-approval row if role is renter or financing is cash
    togglePreapRow();
  }

  function togglePreapRow() {
    const role = getActiveChip('roleChips') || '';
    const fin  = getActiveChip('finChips')  || '';
    const row  = document.getElementById('preapRow');
    if (!row) return;
    row.style.display = (role === 'Renter' || fin === 'Cash') ? 'none' : '';
  }

  // Attach dynamic hide/show to role + financing chips
  document.querySelectorAll('#roleChips .chip, #finChips .chip').forEach(c => {
    c.addEventListener('click', () => setTimeout(togglePreapRow, 0));
  });

  function openPrefs() {
    // Open overlay immediately
    const overlay = document.getElementById('prefsOverlay');
    if (!overlay) {
      console.error('Preferences overlay element not found!');
      return;
    }
    overlay.classList.add('open');
    populatePrefsForm();
    
    // Load data from database in background (don't block UI)
    if (currentUser) {
      loadPrefsAndFin(currentUser.id).catch(err => {
        console.warn('Could not load preferences:', err.message);
      });
    }
  }

  function closePrefs() {
    document.getElementById('prefsOverlay').classList.remove('open');
  }

  async function savePrefs() {
    const saveBtn = document.querySelector('.btn-primary');
    saveBtn.textContent = 'Saving…';
    saveBtn.disabled = true;

    try {
      // ── Users row ──
      const roleLabel  = getActiveChip('roleChips') || 'Buyer';
      const langLabel  = getActiveChip('langChips') || 'عربي';
      const stageIdx   = parseInt(document.getElementById('pLifeStage').value, 10);
      const riskLabel  = getActiveChip('riskChips') || 'Medium';

      console.log('Saving user preferences - userId:', currentUser.id);
      console.log('Role selected:', roleLabel, '→', ROLE_RMAP[roleLabel]);

      // Send user update to backend
      const userRes = await fetch('/api/user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: currentUser.id,
          role: ROLE_RMAP[roleLabel],
          preferred_language: LANG_RMAP[langLabel],
          household_size: parseInt(document.getElementById('pHousehold').value, 10),
          life_stage: STAGE_VALUES[stageIdx] || 'family',
          risk_tolerance: RISK_RMAP[riskLabel]
        })
      });

      if (!userRes.ok) throw new Error(`User update failed: ${userRes.status}`);
      const userResult = await userRes.json();
      console.log('User update result:', userResult);

      // ── user_preferences ──
      const areaMin = Number(document.getElementById('pAreaMin').value) || 0;
      const areaMax = Number(document.getElementById('pAreaMax').value) || 0;
      if (areaMin && areaMax && areaMin > areaMax) throw new Error('Area min must be ≤ Area max.');

      const prefsRes = await fetch('/api/preferences', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: currentUser.id,
          city: document.getElementById('pCity').value.trim(),
          districts_included: parseCsv(document.getElementById('pDistIncl').value),
          districts_excluded: parseCsv(document.getElementById('pDistExcl').value),
          max_commute_minutes: parseInt(document.getElementById('pCommuteMax').value, 10) || 0,
          property_type: document.getElementById('pPropType').value.trim(),
          bedrooms: parseInt(document.getElementById('pBeds').value, 10) || 0,
          bathrooms: parseInt(document.getElementById('pBaths').value, 10) || 0,
          area_min: areaMin,
          area_max: areaMax
        })
      });

      if (!prefsRes.ok) throw new Error(`Preferences update failed: ${prefsRes.status}`);
      const prefsResult = await prefsRes.json();
      console.log('Preferences update result:', prefsResult);

      // ── financial_profiles ──
      const finLabel  = getActiveChip('finChips') || 'Mortgage';
      const preapLbl  = getActiveChip('preapChips') || 'No';
      
      const finRes = await fetch('/api/financial', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: currentUser.id,
          monthly_payment_ceiling: Number(document.getElementById('pMonthly').value) || 0,
          down_payment_budget: Number(document.getElementById('pDown').value) || 0,
          financing: FIN_RMAP[finLabel],
          preapproval_status: preapLbl === 'Yes',
          investment_horizon_months: parseInt(document.getElementById('pHorizon').value, 10) || 0
        })
      });

      if (!finRes.ok) throw new Error(`Financial update failed: ${finRes.status}`);
      const finResult = await finRes.json();
      console.log('Financial update result:', finResult);

      closePrefs();
      showToast('✓  Preferences saved');

      // Show updated properties based on new preferences
      await showWelcomeWithProperties();

    } catch (err) {
      console.error('Save preferences error:', err);
      showToast('⚠ ' + (err.message || 'Save failed'), true);
    } finally {
      saveBtn.textContent = 'Save preferences';
      saveBtn.disabled = false;
    }
  }

  /* ============================================================
     SEND MESSAGE
  ============================================================ */
  let busy = false;

  async function sendMsg() {
    if (busy) return;
    const input = document.getElementById('msgInput');
    const text  = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = '';
    busy = true;
    setInputEnabled(false);

    const typing = document.getElementById('typingRow');
    const msgs   = document.getElementById('messages');
    typing.classList.add('active');
    msgs.scrollTop = msgs.scrollHeight;

    // Save user message
    await saveMessage('user', text);

    try {
      // Check if user is asking about preferences
      const lowerText = text.toLowerCase();
      let reply = '';

      if (lowerText.includes('preference') || lowerText.includes('update') || lowerText.includes('settings')) {
        reply = currentUserRow?.preferred_language === 'ar'
          ? 'يمكنك تحديث تفضيلاتك من خلال الزر أعلاه. سأساعدك في العثور على أفضل العقارات بناءً على احتياجاتك.'
          : 'You can update your preferences using the Preferences button above. I\'ll help you find the best properties based on your needs. What would you like to adjust?';
      } 
      else if (lowerText.includes('show results') || lowerText.includes('search') || lowerText.includes('find') || lowerText.includes('recommendations')) {
        // Reload and show properties
        const properties = await loadPropertiesForUser();
        reply = formatPropertiesMessage(properties);
      }
      else if (lowerText.includes('help') || lowerText.includes('hi') || lowerText.includes('hello')) {
        reply = currentUserRow?.preferred_language === 'ar'
          ? 'أنا هنا لمساعدتك! 👋 يمكنك:\n• اسأل عن العقارات المتاحة\n• اطلب تحديث تفضيلاتك\n• اسأل عن التفاصيل\n\nما الذي تريد تحقيقه؟'
          : 'I\'m here to help! 👋\n\nYou can:\n• Ask about available properties\n• Update your preferences\n• Request more details\n\nWhat would you like to do?';
      }
      else {
        // Default: ask backend or give helpful response
        reply = currentUserRow?.preferred_language === 'ar'
          ? `شكراً لسؤالك! "${text}"\n\nأنا هنا لمساعدتك في:\n1. عرض العقارات المتاحة (اكتب "عرض النتائج")\n2. تحديث تفضيلاتك\n3. الإجابة عن أسئلتك حول العقارات\n\nكيف يمكنني مساعدتك؟`
          : `Thanks for asking! "${text}"\n\nI'm here to help you with:\n1. Viewing available properties (type "show results")\n2. Updating your preferences\n3. Answering questions about properties\n\nWhat would you like to do?`;
      }

      typing.classList.remove('active');
      addBotMessage(reply, true);
      await saveMessage('assistant', reply);

    } catch (err) {
      typing.classList.remove('active');
      const errMsg = 'Error: ' + (err.message || 'Something went wrong.');
      addBotMessage(errMsg, false);
      await saveMessage('assistant', errMsg);
    } finally {
      busy = false;
      setInputEnabled(true);
      input.focus();
    }
  }

  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });

  /* ============================================================
     BOOT — check Supabase session on load
  ============================================================ */
  window.addEventListener('load', async () => {
    setInputEnabled(false);

    const { data: { session } } = await sb.auth.getSession();

    if (!session?.user) {
      // No active session — redirect to your login page
      window.location.href = 'login.html';
      showToast('⚠ Not logged in — redirecting to login…', true);
      console.warn('No active Supabase session found. Redirect to your login page.');
      return;
    }

    try {
      currentUser    = session.user;
      // User will be created/updated via backend API when saving preferences, not here
      conversationId = await getOrCreateConversation(currentUser.id);
      await loadPrefsAndFin(currentUser.id);
      
      // Load message history first
      await loadMessageHistory();
      setInputEnabled(true);
    } catch (err) {
      console.error('Error during initialization:', err);
      // Show that we're ready despite any DB errors
      setInputEnabled(true);
      showToast('⚠ Some features unavailable (DB error), but you can still chat!', true);
    }

    const m = document.getElementById('messages');
    m.scrollTop = m.scrollHeight;
  });
</script>
