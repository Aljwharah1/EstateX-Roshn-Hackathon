services:
  - type: web
    name: estatex-advisor
    env: python
    plan: free
    runtime: python-3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: OPENAI_API_KEY
        scope: run
        value: ${OPENAI_API_KEY}
